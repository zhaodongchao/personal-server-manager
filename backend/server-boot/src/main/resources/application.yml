server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: serverpanel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:server_panel}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:panel}
    password: ${MYSQL_PASSWORD:Panel@123456}
    druid:
      initial-size: 2
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.serverpanel.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: 7200
  is-log: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ServerPanel 自有配置
serverpanel:
  # 文件管理（根目录白名单 / 回收站目录 / 保留天数）
  file:
    roots: ${PANEL_FILE_ROOTS:/www,/srv,/var/www}
    trash-dir: ${PANEL_TRASH_DIR:/var/serverpanel/trash}
    trash-retain-days: 7
  # 登录防爆破
  login:
    max-fail: 5
    lock-minutes: 15
  # 监控采集间隔（秒）
  monitor:
    interval-seconds: 5
  # 命令执行
  command:
    timeout-seconds: 30
    max-output-bytes: 2097152
  # 面板代管 MySQL 的管理连接
  mysql-admin:
    host: ${PANEL_MYSQL_ADMIN_HOST:localhost}
    port: ${PANEL_MYSQL_ADMIN_PORT:3306}
    username: ${PANEL_MYSQL_ADMIN_USER:root}
    password: ${PANEL_MYSQL_ADMIN_PASSWORD:}
  nginx:
    conf-dir: ${PANEL_NGINX_CONF_DIR:/etc/nginx/panel.d}
  docker:
    host: ${PANEL_DOCKER_HOST:unix:///var/run/docker.sock}
