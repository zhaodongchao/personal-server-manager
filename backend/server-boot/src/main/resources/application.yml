server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: serverpanel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:server_panel}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:zhaodc}
    password: ${MYSQL_PASSWORD:cJZ-c5aWfMXC6El65KkQJwAX}
    druid:
      initial-size: 2
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=500
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  # MongoDB（偏好设置等文档型存储）。注意：SB4 起连接属性前缀为 spring.mongodb（不再是 spring.data.mongodb）；
  # 连接串可经 MONGODB_URI 覆盖（默认库名 server_panel，认证库 admin）
  mongodb:
    uri: ${MONGODB_URI:mongodb://server_panel:um7Z4wk50Dfv5G7BE92xLPDB@127.0.0.1:27017/server_panel?authSource=admin}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:9yXP+AET4sqrh%+J3zB7q*SLWkv5uDj5}
      database: ${REDIS_DB:0}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 512MB
      max-request-size: 512MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.serverpanel.**.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-cookie: false
  is-concurrent: false
  is-share: false
  timeout: 86400
  active-timeout: 7200
  is-log: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# ServerPanel 自有配置
serverpanel:
  # 文件管理（根目录白名单 / 回收站目录 / 保留天数）
  file:
    roots: ${PANEL_FILE_ROOTS:/www,/srv,/var/www}
    trash-dir: ${PANEL_TRASH_DIR:/var/serverpanel/trash}
    trash-retain-days: 7
  # 登录防爆破
  login:
    max-fail: 5
    lock-minutes: 15
  # 审计与高危操作（二级认证）
  # record-denied：是否把被鉴权层拒绝的请求（module=access）落审计；量大或不需要该视角时可关。
  # enforce-safe：@Audit(safe = true) 的二级认证闸门总开关，置 false 可一键关停而不发版
  #               —— 与 job.scheduler.enabled 同类，属可配置的故障处置手段。
  audit:
    record-denied: ${PANEL_AUDIT_RECORD_DENIED:true}
    enforce-safe: ${PANEL_AUDIT_ENFORCE_SAFE:true}
    safe-timeout-seconds: ${PANEL_AUDIT_SAFE_TIMEOUT:300}
  # 监控采集间隔（秒）；host-sysroot：容器部署时宿主机根挂载路径（如 -v /:/host 后设 /host），
  # 用于读取宿主机挂载表与块设备（磁盘/LVM/文件系统），裸机部署留空（未配置时自动探测 /host、/hostfs、/mnt/host）
  monitor:
    interval-seconds: 5
    host-sysroot: ${HOST_SYSROOT:}
  # 命令执行
  command:
    timeout-seconds: 30
    max-output-bytes: 2097152
  # 定时任务（应用栈 → 定时任务管理 / 定时任务日志）
  # scheduler.enabled=false 可一键停止全部定时任务，而**不影响面板其它功能与既有 @Scheduled**
  # —— 这是本模块不需要改代码、不需要回滚版本的故障处置手段。
  job:
    scheduler:
      enabled: ${PANEL_JOB_ENABLED:true}
      # 调度池只做唤醒与派发，真实执行在独立的虚拟线程池（二者必须分离）
      pool-size: 4
    log:
      retention-days: ${PANEL_JOB_LOG_RETENTION_DAYS:30}
      max-output-bytes: 65536
    limits:
      # 最小触发间隔（秒）：防秒级任务把宿主与数据库一起打爆
      min-interval-seconds: 10
      # 与宿主代理 MAX_TIMEOUT=900 对齐
      max-timeout-seconds: 900
      max-retry-count: 3
  # 宿主执行通道：容器内没有 systemctl/journalctl/ufw，系统管理类操作统一经
  # 宿主机 psm-hostagent 代理执行。代理只监听 AF_UNIX 套接字、不监听任何 TCP 端口；
  # 密钥文件 0400 只读挂载进容器。详见 documents/api-spec.md 第六节。
  host-agent:
    socket-path: ${PSM_HOSTAGENT_SOCKET:/run/psm-hostagent/agent.sock}
    secret-file: ${PSM_HOSTAGENT_SECRET_FILE:/etc/psm-hostagent/secret}
    connect-timeout-ms: 3000
    default-timeout-seconds: 30
    max-timeout-seconds: 900
  # 取号数据源口令的加密密钥（ID 生成器 -> 应用栈「取号数据源」）
  # key 留空时退化为「从宿主代理密钥派生」，只为开箱可用；生产环境请显式配置 ——
  # 共用密钥意味着轮换宿主代理密钥会让已保存的全部数据源口令解密失败。
  secret:
    key: ${PANEL_SECRET_KEY:}
    hostagent-secret-file: ${PSM_HOSTAGENT_SECRET_FILE:/etc/psm-hostagent/secret}
  # ID 生成器「自增 / 序列」方案的真连库取号
  # allowed-databases：允许作为取号目标的库（默认只放开专用库 psm_tools）。
  #   注意：面板自身库与 Dify 生产库（server_panel / dify / dify_plugin / postgres
  #   及各数据库的系统库）在代码里是硬黑名单，写在这里也不会放开。
  id-source:
    allowed-databases: ${PANEL_ID_SOURCE_DBS:psm_tools}
  # 面板代管 MySQL 的管理连接
  mysql-admin:
    host: ${PANEL_MYSQL_ADMIN_HOST:localhost}
    port: ${PANEL_MYSQL_ADMIN_PORT:3306}
    username: ${PANEL_MYSQL_ADMIN_USER:root}
    password: ${PANEL_MYSQL_ADMIN_PASSWORD:}
  docker:
    host: ${PANEL_DOCKER_HOST:unix:///var/run/docker.sock}
